<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEXICAN CAT (rápido)</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Estilo mínimo y barato (sin blur/gradients pesados) */
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      body {
        background: #0b0f17;
      }
      body.playing {
        background: #fff;
      }
      model-viewer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        --poster-color: transparent;
        --progress-bar-color: transparent;
        opacity: 0;
        transition: opacity 0.2s ease; /* aparece suave al cargar */
      }
      body.playing model-viewer.ready {
        opacity: 1;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
      }
      .card {
        background: #111827;
        border: 1px solid #222;
        padding: 16px 20px;
        border-radius: 12px;
        text-align: center;
      }
      .play {
        padding: 10px 16px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        font-weight: 700;
      }
      .msg {
        margin-top: 8px;
        font-size: 12px;
        color: #ffb4b4;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- OJO: en Vite los archivos de /public se sirven como /assets/... -->
      <model-viewer
        id="viewer"
        data-src="/assets/mexicancat2.glb"
        camera-controls
        min-camera-orbit="auto auto 0.1m"
        max-camera-orbit="auto auto 1000m"
        min-field-of-view="5deg"
        max-field-of-view="80deg"
        interaction-prompt="none"
        environment-image="neutral"
        exposure="1"
        shadow-intensity="0"
        autoplay="false"
      >
      </model-viewer>

      <div class="overlay" id="overlay">
        <div class="card">
          <h1>MEXICAN CAT</h1>
          <p>Play inicia animación + música y muestra el modelo.</p>
          <button id="playBtn" class="play">▶️ Play</button>
          <div id="msg" class="msg" aria-live="polite"></div>
        </div>
      </div>

      <audio id="bgm" src="/assets/mexican_cat.mp3" preload="none"></audio>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
